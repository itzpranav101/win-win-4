    <style>
      html.lenis { height: auto; }
      .lenis.lenis-smooth { scroll-behavior: auto; }
      .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
      .lenis.lenis-stopped { overflow: hidden; }
      
      body {
        margin: 0; padding: 0;
        background-color: #F5F5F0; color: #002B5B;
        overflow-x: hidden; -webkit-font-smoothing: antialiased;
      }
      .dark body { background-color: #070d1e; color: #F8FAFC; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #1e3a8a; }
      
      .blender-viewport { 
        overflow: hidden; 
      }
      .page-3d-wrapper { 
        width: 100%;
      }

      .glow-card-container {
        position: relative;
        z-index: 2;
        cursor: pointer;
        transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
      }

      .glow-card-container:hover {
        box-shadow: 0 18px 45px rgb(0 43 91 / 10%);
      }

      .glow-card-bg {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: -1;
        background: linear-gradient(135deg, rgba(0, 43, 91, 0.04), rgba(212, 180, 131, 0.08));
        opacity: 0;
        transition: opacity 0.24s ease;
      }

      .glow-card-container:hover .glow-card-bg {
        opacity: 1;
      }

      .glow-element {
        display: none;
      }
    </style>
