name: Deploy to GitHub Pages

# Only used if the site is hosted on GitHub Pages instead of Cloudflare Pages.
# Push-triggered runs are skipped unless the repository variable
# DEPLOY_TO_GITHUB_PAGES is set to "true"; it can always be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.DEPLOY_TO_GITHUB_PAGES == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is served from the root of its own domain (win-win.co.in).
      # For a plain https://<user>.github.io/<repo>/ address, set the repository
      # variable BASE_PATH to "/<repo>/".
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
